<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAT1ON Stüdyo</title>
<style>
:root{--bg:#050506;--ink:#f4f4f0;--dim:#96968f;--acc:#ffb028}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:600 18px/1.5 system-ui,sans-serif;text-align:center;padding:16px}
b{color:var(--acc)} small{color:var(--dim);display:block;margin-top:8px}
</style></head><body>
<div><b>RAT1ON</b> Stüdyo'ya bağlanıyor…<small id="m"></small></div>
<script>
// The studio runs on the owner's PC behind a Cloudflare quick tunnel whose URL changes on every start;
// site/tunel.py writes the current URL into adres.json in this repo. Read it fresh and redirect (keeps #hash).
const m = document.getElementById('m');
const get = async u => { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw 0; return r.json(); };
(async () => {
  let d = null;
  try { const a = await get('https://api.github.com/repos/tanisman441/studyo/contents/adres.json?ref=main');
        d = JSON.parse(decodeURIComponent(escape(atob(a.content.replace(/\n/g, ''))))); } catch (e) {}
  if (!d) try { d = await get('adres.json?t=' + Date.now()); } catch (e) {}
  if (!d || !d.url || !d.acik) { m.textContent = 'Stüdyo şu an kapalı. Biraz sonra tekrar dene.'; return; }
  location.replace(d.url.replace(/\/$/, '') + location.pathname.replace(/^\/studyo/, '').replace(/^\/$/, '/') + location.search + location.hash);
})();
</script>
</body></html>
